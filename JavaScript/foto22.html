<!DOctype html >
<html lang="de-DE">
<head>
<title>javascript</title>
<meta charset="Utf-8">
<style>    

#klein img		{	height:80px;
				cursor:pointer; }
#klein, #gross	{	text-align:center;	}

</style>

<script>
  	function klasse(){
			document.getElementById("anzeige").className = "extra";
		}
		
 function erzeugen(){
			let tx = document.querySelector("#eingabe").value;
			let neu = document.createElement("p");
			let inhalt = document.createTextNode(tx);
			neu.appendChild(inhalt);
			neu.style.color = "red";
			document.body.appendChild(neu);
}
 function tauschen(q){
			document.querySelector("#gross img").src = q;
		}
	

</script>
</head>
<body>
    <h1>JavaScript</h1>
		
    <input type="text" id="eingabe">
		<button onclick="erzeugen();">Absatz anlegen</button>
		<hr>
	
    <div id="klein">
    <img src="apollo13.jpg" onclick="tauschen('apollo13.jpg');" >
    <img src="harrysally.jpg" onclick="tauschen('harrysally.jpg');" >
    <img src="jamesbondjagtdrno.jpg" onclick="tauschen('jamesbondjagtdrno.jpg');">
    <img src="stirblangsam.jpg" onclick="tauschen('stirblangsam.jpg');">
    <img src="austinpowers.jpg"  onclick="tauschen('austinpowers.jpg');">

    </div>
    <hr>
    <div id="gross">
    <img src="apollo13.jpg"  >
    </div>
	
<script>

       let q= document.querySelectorAll("#klein img")[i].onclick = function(){ tauschen(q);};    
    }*/
		
</script> 
</body>
</html>
