<!DOctype html >
<html lang="de-DE">
<head>
<title>javascript</title>

<style>    

#klein img		{	height:80px;

<script>
  	function klasse(){
			document.getElementById("neu").className = "extra";
		}
		
 function erzeugen(){
			let tx = document.querySelector("#eingabe").value;
			let neu = document.createElement("p");
			let inhalt = document.createTextNode(tx);
			neu.appendChild(inhalt);
			neu.style.color = "red";
			document.body.appendChild(neu);
}
 function tauschen(q){
			document.querySelector("#gross img").src = q;
		}
		function hintergrund(){
			document.getElementById("far").style.backgroundColor = "red";
		
    
    }
		

</script>
</head>

      let jetzt = new Date();
let std = diff.getHours();

let sek = diff.getSeconds();
